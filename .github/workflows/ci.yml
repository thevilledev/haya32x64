name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: GitHub Actions security
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.28.0
          advanced-security: false
          annotations: true

  c:
    name: C (${{ matrix.compiler }})
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: >-
          make -C tests
          CC=${{ matrix.compiler }}
          CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"
          test

  sanitize:
    name: C (ASan + UBSan)
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run under sanitizers
        run: >-
          make -C tests
          CC=clang
          CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -fno-sanitize-recover=all"
          test

  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install package metadata
        run: npm ci
        working-directory: js
      - name: Test both engines
        run: npm test
        working-directory: js
      - name: Typecheck public declarations
        if: matrix.node == 22
        run: npm run typecheck
        working-directory: js
      - name: Check publish contents
        if: matrix.node == 22
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm run test:package && npm run lint:package
        working-directory: js

  differential:
    name: C reference vs JavaScript engines
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Generate C-reference corpus
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror \
            tests/differential/generate.c \
            -o tests/differential/generate
          tests/differential/generate \
            "${{ runner.temp }}/haya32x64.bin" \
            0x0123456789abcdef 4096
      - name: Replay both JavaScript engines
        env:
          HAYA32X64_CORPUS: ${{ runner.temp }}/haya32x64.bin
        run: node --test js/test/differential.test.mjs

  wasm-reproducible:
    name: WebAssembly artifact
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Rebuild committed wasm and embedded bytes
        run: npm run build:wasm
        working-directory: js
      - name: Check generated artifacts are reproducible
        run: git diff --exit-code -- js/wasm/haya32x64.wasm js/wasm-module.js

  big-endian:
    name: C (s390x big endian)
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Cross-compile and run the full C suite
        run: |
          for test_name in kat verify streaming; do
            zig cc -target s390x-linux-musl \
              -O2 -std=c11 -Wall -Wextra -Werror \
              "tests/${test_name}.c" \
              -o "${{ runner.temp }}/${test_name}-s390x"
          done
          zig cc -target s390x-linux-musl \
            -O2 -std=c11 -Wall -Wextra -Werror \
            tests/quality.c -lm -o "${{ runner.temp }}/quality-s390x"

          qemu-s390x "${{ runner.temp }}/kat-s390x" \
            > "${{ runner.temp }}/kat-s390x.txt"
          diff -u tests/kat.txt "${{ runner.temp }}/kat-s390x.txt"
          qemu-s390x "${{ runner.temp }}/verify-s390x"
          qemu-s390x "${{ runner.temp }}/quality-s390x"
          qemu-s390x "${{ runner.temp }}/streaming-s390x"

  ilp32:
    name: C (x86 32-bit ILP32)
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Cross-compile and run the full C suite
        run: |
          for test_name in kat verify streaming; do
            zig cc -target x86-linux-musl \
              -O2 -std=c11 -Wall -Wextra -Werror \
              "tests/${test_name}.c" \
              -o "${{ runner.temp }}/${test_name}-i386"
          done
          zig cc -target x86-linux-musl \
            -O2 -std=c11 -Wall -Wextra -Werror \
            tests/quality.c -lm -o "${{ runner.temp }}/quality-i386"

          for test_name in kat verify quality streaming; do
            file "${{ runner.temp }}/${test_name}-i386" |
              grep -q "ELF 32-bit"
          done

          qemu-i386 "${{ runner.temp }}/kat-i386" \
            > "${{ runner.temp }}/kat-i386.txt"
          diff -u tests/kat.txt "${{ runner.temp }}/kat-i386.txt"
          qemu-i386 "${{ runner.temp }}/verify-i386"
          qemu-i386 "${{ runner.temp }}/quality-i386"
          qemu-i386 "${{ runner.temp }}/streaming-i386"

  msvc:
    name: C (MSVC x64)
    runs-on: avrea-windows-2025-2-vcpu
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and run the full C suite
        shell: cmd # zizmor: ignore[misfeature] -- required for VsDevCmd.bat
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cl /nologo /std:c11 /O2 /W4 /WX tests\kat.c /Fe:kat.exe
          kat.exe > kat-msvc.txt
          cl /nologo /std:c11 /O2 /W4 /WX tests\verify.c /Fe:verify.exe
          verify.exe
          cl /nologo /std:c11 /O2 /W4 /WX tests\quality.c /Fe:quality.exe
          quality.exe
          cl /nologo /std:c11 /O2 /W4 /WX tests\streaming.c /Fe:streaming.exe
          streaming.exe
      - name: Compare KAT
        shell: pwsh
        run: |
          $expected = (Get-Content tests/kat.txt) -join "`n"
          $actual = (Get-Content kat-msvc.txt) -join "`n"
          if ($expected -ne $actual) {
            Compare-Object (Get-Content tests/kat.txt) (Get-Content kat-msvc.txt)
            exit 1
          }

  arm:
    name: C (AArch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: >-
          make -C tests
          CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"
          test

  cpp:
    name: C++ (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [c++11, c++17]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and run as C++
        run: |
          for test_name in kat verify streaming; do
            ${{ matrix.compiler }} \
              -O2 -x c++ -std=${{ matrix.std }} -Wall -Wextra -Werror \
              "tests/${test_name}.c" \
              -o "${{ runner.temp }}/${test_name}-cpp"
          done
          "${{ runner.temp }}/kat-cpp" > "${{ runner.temp }}/kat-cpp.txt"
          diff -u tests/kat.txt "${{ runner.temp }}/kat-cpp.txt"
          "${{ runner.temp }}/verify-cpp"
          "${{ runner.temp }}/streaming-cpp"

  fuzz:
    name: C (libFuzzer one-shot vs stream)
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the clang sanitizer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
      - name: Build the fuzz target
        run: make -C tests/fuzz CC=clang
      - name: Fuzz
        run: make -C tests/fuzz CC=clang fuzz-run FUZZ_SECONDS=60
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  smhasher3-verify:
    name: SMHasher3 verify
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ git make
      - name: Cache pinned SMHasher3 tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/smhasher3/smhasher3
          key: smhasher3-${{ runner.os }}-${{ hashFiles('tests/smhasher3/Makefile', 'tests/smhasher3/haya32x64.cpp') }}
      - name: Verify canonical and byte-swapped codes
        run: make -C tests/smhasher3 verify
