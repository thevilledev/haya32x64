name: Release

# One annotated vX.Y.Z tag publishes the JavaScript package through npm
# trusted publishing and creates a GitHub release carrying the standalone C
# header. The version check refuses to release when the manifest and tag
# disagree. Publish and GitHub release both wait for the reusable CI
# workflow, so a tag cannot ship a C or portability regression that
# ci.yml would have caught.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml

  check:
    name: Version consistency
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify package manifest matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version js/package.json)"
          if [ "$version" != "$tag" ]; then
            echo "::error::js/package.json is at version '$version' but the tag says '$tag'"
            exit 1
          fi

  npm:
    name: Publish to npm
    needs: [ci, check]
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@11.5.1 # zizmor: ignore[adhoc-packages] -- trusted publishing minimum

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Test
        run: npm test
        working-directory: js

      - name: Check package contents
        run: npm pack --dry-run
        working-directory: js

      # The first version must be bootstrapped interactively before npm has a
      # package settings page on which to authorize this workflow. Skipping an
      # already-published version keeps that one-time bootstrap tag idempotent.
      - name: Check whether this version is already published
        id: published
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          if npm view "haya32x64@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "haya32x64@${version} is already published"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.exists != 'true'
        run: npm publish
        working-directory: js

  github-release:
    name: GitHub release
    needs: [ci, check]
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release with C header
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "haya32x64 ${GITHUB_REF_NAME}" --generate-notes \
              haya32x64.h
          fi
