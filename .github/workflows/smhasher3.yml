name: SMHasher3

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smhasher3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: Pinned full suite
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ git make
      - name: Cache pinned SMHasher3 tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/smhasher3/smhasher3
          key: smhasher3-${{ runner.os }}-${{ hashFiles('tests/smhasher3/Makefile', 'tests/smhasher3/haya32x64.cpp') }}
      - name: Run haya32x64 through the pinned suite
        run: |
          set -o pipefail
          make -C tests/smhasher3 run 2>&1 | tee smhasher3.log
      - name: Upload harness log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smhasher3-${{ github.run_id }}-${{ github.run_attempt }}
          path: smhasher3.log
          if-no-files-found: ignore
          retention-days: 30
