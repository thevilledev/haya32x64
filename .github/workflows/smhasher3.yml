name: SMHasher3

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smhasher3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: Pinned full suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ git make
      - name: Run haya32x64 through the pinned suite
        run: make -C tests/smhasher3 run
